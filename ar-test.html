
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LogicAR - Surface Detection</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #overlay {
      position: fixed;
      top: 15px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #status {
      display: inline-block;
      background: #16213A;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="overlay">
    <p id="status">LogicAR - Ready</p>
  </div>


<a-scene
  webxr="
    optionalFeatures: hit-test, dom-overlay;
    overlayElement: #overlay;
  "
  xr-mode-ui="XRMode: ar"
  renderer="alpha: true; colorManagement: true"
  ar-hit-test="target: #reticle"
>

    <!-- Camera -->
    <a-camera></a-camera>

    <!-- Lighting -->
    <a-entity
      light="type: ambient; intensity: 1"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1"
      position="1 3 2"
    ></a-entity>

    <!-- Surface Reticle -->
    <a-entity id="reticle" visible="true">

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="0.055"
        radius-outer="0.07"
        material="
        color: #00FF88;
        shader: flat;
        side: double;
        "
    ></a-ring>

    <a-circle
        position="0 0.001 0"
        rotation="-90 0 0"
        radius="0.015"
        material="
        color: #00FF88;
        shader: flat;
        opacity: 0.5;
        transparent: true;
        side: double;
        "
    ></a-circle>

    </a-entity>

    <!-- AND Gate -->
    <a-entity id="gate" visible="false">

      <!-- Gate Body -->
      <a-box
        position="0 0.075 0"
        width="0.30"
        height="0.15"
        depth="0.08"
        color="#00D4FF"
        metalness="0.3"
        roughness="0.35"
      ></a-box>

      <!-- Gate Label -->
      <a-text
        value="AND GATE"
        align="center"
        color="#FFFFFF"
        position="0 0.17 0"
        scale="0.22 0.22 0.22"
      ></a-text>

    </a-entity>

  </a-scene>

  <script>


const scene = document.querySelector("a-scene");
const status = document.getElementById("status");

scene.addEventListener("enter-vr", () => {
  status.textContent = "AR Started - Scan a surface";
});

scene.addEventListener("ar-hit-test-start", () => {
  status.textContent = "Scanning surfaces...";
});

scene.addEventListener("ar-hit-test-achieved", () => {
  status.textContent = "Surface detected! Tap to place AND Gate";
});

scene.addEventListener("ar-hit-test-select", (event) => {

    const reticle = document.querySelector("#reticle");
    const gate = document.querySelector("#gate");

    scene.addEventListener("ar-hit-test-achieved", () => {
    status.textContent = "Surface detected - Reticle active!";
    });

    scene.addEventListener("ar-hit-test-select", () => {

    // Get the real-world position
    // of the reticle
    const position = new THREE.Vector3();
    const rotation = new THREE.Quaternion();

    reticle.object3D.getWorldPosition(position);
    reticle.object3D.getWorldQuaternion(rotation);

    // Place the AND Gate
    gate.object3D.position.copy(position);
    gate.object3D.quaternion.copy(rotation);

    // Show the gate
    gate.setAttribute("visible", true);

    // Hide the reticle after placement
    reticle.setAttribute("visible", false);

    status.textContent = "AND Gate placed successfully!";
    });

});

scene.addEventListener("exit-vr", () => {
  status.textContent = "AR Session Ended";
});

  </script>

</body>
</html>
