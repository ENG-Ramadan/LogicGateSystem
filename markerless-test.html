
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LogicAR - Markerless Test</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

#overlay {
  pointer-events: none;
}

#startAR {
  pointer-events: auto;
  position: relative;
  z-index: 100;
  padding: 14px 25px;
  background: #00D4FF;
  color: #16213A;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

    #status {
      color: white;
      background: #16213A;
      padding: 12px;
      margin: 10px auto;
      width: fit-content;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div id="overlay">
    <p id="status">Ready to start AR</p>
    <button id="startAR">Enter AR</button>
  </div>

<a-scene
  webxr="
    requiredFeatures: hit-test;
    optionalFeatures: dom-overlay;
    overlayElement: #overlay;
  "
  renderer="alpha: true; colorManagement: true"
  vr-mode-ui="enabled: false"
>

  <script>

const scene = document.querySelector("a-scene");
const status = document.getElementById("status");
const startButton = document.getElementById("startAR");

startButton.addEventListener("click", async () => {
  try {
    status.textContent = "Starting AR...";

    await scene.enterVR();

    status.textContent = "AR Started!";
  } catch (error) {
    console.error("AR Error:", error);

    status.textContent =
      error.name + ": " + error.message;
  }
});
  try {
    status.textContent = "Starting AR...";

    if (!navigator.xr) {
      throw new Error("WebXR is unavailable");
    }

    const supported =
      await navigator.xr.isSessionSupported("immersive-ar");

    if (!supported) {
      throw new Error("AR is not supported");
    }

    const session = await navigator.xr.requestSession(
      "immersive-ar",
      {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: {
          root: document.getElementById("overlay")
        }
      }
    );

    await scene.renderer.xr.setSession(session);

    status.textContent = "AR Started! Move your phone.";

    session.addEventListener("end", () => {
      status.textContent = "AR Stopped";
    });

  } catch (error) {
    console.error("AR Error:", error);
    status.textContent = error.name + ": " + error.message;
  }
});

  </script>

</body>
</html>
