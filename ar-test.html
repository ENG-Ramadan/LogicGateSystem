
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LogicAR - Surface Detection</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #overlay {
      position: fixed;
      top: 15px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #status {
      display: inline-block;
      background: #16213A;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="overlay">
    <p id="status">LogicAR - Ready</p>
  </div>


<a-scene
  webxr="
    optionalFeatures: hit-test, dom-overlay;
    overlayElement: #overlay;
  "
  xr-mode-ui="XRMode: ar"
  renderer="
    alpha: true;
    colorManagement: true;
    antialias: true;
  "
  ar-hit-test="target: #gate"
>

    <!-- Camera -->
    <a-camera></a-camera>

    <!-- Lighting -->
    <a-entity
      light="type: ambient; intensity: 1"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1"
      position="1 3 2"
    ></a-entity>

    <!-- AND Gate -->
    <a-entity id="gate" visible="false">

      <!-- Gate Body -->
      <a-box
        position="0 0.075 0"
        width="0.30"
        height="0.15"
        depth="0.08"
        color="#00D4FF"
        metalness="0.3"
        roughness="0.35"
      ></a-box>

      <!-- Gate Label -->
      <a-text
        value="AND GATE"
        align="center"
        color="#FFFFFF"
        position="0 0.17 0"
        scale="0.22 0.22 0.22"
      ></a-text>

    </a-entity>

  </a-scene>

  <script>

    const scene = document.querySelector("a-scene");
    const status = document.getElementById("status");
    
    scene.addEventListener("enter-vr", () => {

    const session = scene.renderer.xr.getSession();

    console.log("AR Session Started");
    console.log(
        "Environment Blend Mode:",
        session.environmentBlendMode
    );

    console.log(
        "Reference Space:",
        session.visibilityState
    );

    });
    // AR Started
    scene.addEventListener("enter-vr", () => {
      status.textContent =
        "AR Started - Move your phone to scan surfaces";
    });

    // Hit Test Started
    scene.addEventListener("ar-hit-test-start", () => {
      status.textContent =
        "Scanning... Move your phone slowly";
    });

    // Surface Found
    scene.addEventListener("ar-hit-test-achieved", () => {
      status.textContent =
        "Surface detected! Tap to place AND Gate";
    });

    // Object Placed
    scene.addEventListener("ar-hit-test-select", () => {
      status.textContent =
        "AND Gate placed successfully!";
    });

    // AR Ended
    scene.addEventListener("exit-vr", () => {
      status.textContent =
        "AR Session Ended";
    });

  </script>

</body>
</html>
